<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>File View</title><script src="[[.Base]]/assets/tailwind.browser.js"></script><script src="[[.Base]]/assets/vue.global.prod.js"></script><script src="[[.Base]]/assets/mammoth.browser.min.js"></script><script src="[[.Base]]/assets/xlsx.full.min.js"></script>
<style>[v-cloak]{display:none}.docx-view h1{font-size:2em;font-weight:700}.docx-view h2{font-size:1.5em;font-weight:650}.docx-view p{margin:.7em 0}.docx-view table{border-collapse:collapse}.docx-view td,.docx-view th{border:1px solid #475569;padding:.4rem}.xlsx-view table{border-collapse:collapse;min-width:max-content;font-size:13px}.xlsx-view td,.xlsx-view th{border:1px solid #cbd5e1;padding:.4rem .6rem;white-space:nowrap}.xlsx-view tr:first-child td{background:#e2e8f0;font-weight:600;position:sticky;top:0}</style></head>
<body data-base="[[.Base]]" data-preview-token="[[.PreviewToken]]" data-preview-port="[[.PreviewPort]]" data-username="[[.Username]]" data-is-admin="[[.IsAdmin]]" data-can-upload="[[.CanUpload]]" class="min-h-screen bg-slate-950 text-slate-100"><div id="app" v-cloak class="min-h-screen">
  <header class="sticky top-0 z-20 border-b border-white/10 bg-slate-950/85 backdrop-blur-xl"><div class="mx-auto flex max-w-7xl items-center gap-3 px-4 py-3">
    <button @click="goRoot" class="text-lg font-bold tracking-wide"><span class="text-cyan-400">FILE</span> VIEW</button><div class="min-w-0 flex-1 overflow-x-auto whitespace-nowrap text-sm text-slate-400">
      <button @click="goRoot" class="hover:text-cyan-300">根目录</button><template v-for="(part,i) in crumbs"><span class="mx-2">/</span><button @click="goCrumb(i)" class="hover:text-cyan-300">{{part}}</button></template>
    </div><span class="hidden text-sm text-slate-400 sm:inline">{{username}}</span><button v-if="isAdmin" @click="openUsers" class="rounded-lg border border-cyan-500/30 px-3 py-2 text-sm text-cyan-300 hover:bg-cyan-500/10">用户管理</button><a :href="base+'/logout'" class="rounded-lg border border-white/10 px-3 py-2 text-sm hover:bg-white/5">退出</a>
  </div></header>
  <main class="mx-auto max-w-7xl p-4 sm:p-6"><div v-if="dragging&&!preview" class="pointer-events-none fixed inset-0 z-30 grid place-items-center bg-slate-950/80 p-6 backdrop-blur-sm"><div class="rounded-3xl border-2 border-dashed border-cyan-400 bg-cyan-500/10 px-10 py-14 text-center shadow-2xl"><div class="text-5xl">⬆️</div><div class="mt-4 text-xl font-semibold text-white">释放文件以上传</div><div class="mt-2 text-sm text-cyan-200">上传到：{{currentName}}</div></div></div><div class="mb-5 flex flex-wrap items-center justify-between gap-3">
    <div><h1 class="text-xl font-semibold">{{ currentName }}</h1><p class="mt-1 text-xs text-slate-500">{{items.length}} 个项目</p></div>
    <div class="flex gap-2"><a :href="zipURL" class="rounded-xl border border-white/10 px-4 py-2.5 text-sm hover:bg-white/5">下载当前目录 ZIP</a><label v-if="canUpload" class="cursor-pointer rounded-xl bg-cyan-500 px-4 py-2.5 text-sm font-semibold text-slate-950 hover:bg-cyan-400">上传文件<input type="file" multiple class="hidden" @change="uploadFiles($event.target.files);$event.target.value=''" /></label></div>
  </div>
  <div :class="dragging?'border-cyan-400 bg-cyan-500/10':'border-white/10'" class="overflow-hidden rounded-2xl border bg-slate-900/60 transition">
    <div v-if="loading" class="p-12 text-center text-slate-400">正在加载…</div><div v-else-if="!items.length" class="p-16 text-center text-slate-500">目录为空，可拖拽文件到这里上传</div>
    <div v-else class="divide-y divide-white/5"><div v-for="item in items" :key="item.path" class="group flex items-center gap-3 px-4 py-3 hover:bg-white/[.035]">
      <button @click="openItem(item)" class="flex min-w-0 flex-1 items-center gap-3 text-left"><span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-slate-800 text-xl">{{icon(item)}}</span><span class="min-w-0"><span class="block truncate text-sm font-medium sm:text-base">{{item.name}}</span><span class="mt-1 block text-xs text-slate-500">{{item.is_dir?'文件夹':formatSize(item.size)}} · {{formatDate(item.mod_time)}}</span></span></button>
      <a v-if="item.is_dir" :href="base+'/api/zip?path='+enc(item.path)" class="rounded-lg px-3 py-2 text-xs text-slate-400 hover:bg-white/5 hover:text-white">ZIP</a><template v-else><button v-if="previewable(item)" @click="openItem(item)" class="rounded-lg bg-cyan-500/10 px-3 py-2 text-xs font-medium text-cyan-300 hover:bg-cyan-500/20">{{item.ext==='.docx'?'在线预览':'预览'}}</button><a :href="base+'/api/download?path='+enc(item.path)" class="rounded-lg px-3 py-2 text-xs text-slate-400 hover:bg-white/5 hover:text-white">下载</a></template>
    </div></div>
  </div><div v-if="message" class="fixed bottom-5 left-1/2 z-50 -translate-x-1/2 rounded-xl bg-slate-800 px-4 py-3 text-sm shadow-xl">{{message}}</div></main>
  <div v-if="userModal" class="fixed inset-0 z-50 overflow-auto bg-slate-950/90 p-4 backdrop-blur-sm"><div class="mx-auto max-w-5xl rounded-2xl border border-white/10 bg-slate-900 shadow-2xl"><div class="flex items-center border-b border-white/10 p-5"><div class="flex-1"><h2 class="text-xl font-semibold">用户管理</h2><p class="mt-1 text-sm text-slate-400">账号与权限保存在 SQLite 数据库中</p></div><button @click="userModal=false" class="rounded-lg px-3 py-2 text-xl hover:bg-white/10">×</button></div>
    <form @submit.prevent="createUser" class="grid gap-3 border-b border-white/10 p-5 sm:grid-cols-2 lg:grid-cols-5"><input v-model.trim="newUser.username" required placeholder="新用户名" class="rounded-lg border border-white/10 bg-slate-950 px-3 py-2"><input v-model="newUser.password" required minlength="6" type="password" placeholder="密码（至少 6 位）" class="rounded-lg border border-white/10 bg-slate-950 px-3 py-2"><label class="flex items-center gap-2 text-sm"><input v-model="newUser.can_upload" type="checkbox">允许上传</label><label class="flex items-center gap-2 text-sm"><input v-model="newUser.is_admin" type="checkbox">管理员</label><button class="rounded-lg bg-cyan-500 px-4 py-2 font-semibold text-slate-950">新增用户</button></form>
    <div class="space-y-3 p-5"><div v-for="u in users" :key="u.id" class="grid items-center gap-3 rounded-xl border border-white/10 bg-slate-950/60 p-3 lg:grid-cols-[1.2fr_1.2fr_auto_auto_auto_auto]"><input v-model.trim="u.username" class="rounded-lg border border-white/10 bg-slate-900 px-3 py-2"><input v-model="u.password" type="password" placeholder="留空则不修改密码" class="rounded-lg border border-white/10 bg-slate-900 px-3 py-2"><label class="flex items-center gap-2 text-sm"><input v-model="u.can_upload" type="checkbox">上传</label><label class="flex items-center gap-2 text-sm"><input v-model="u.is_admin" type="checkbox">管理员</label><button @click="saveUser(u)" class="rounded-lg bg-cyan-500/15 px-3 py-2 text-sm text-cyan-300">保存</button><button @click="deleteUser(u)" :disabled="u.id===currentUserId" class="rounded-lg px-3 py-2 text-sm text-red-300 hover:bg-red-500/10 disabled:cursor-not-allowed disabled:opacity-30">删除</button></div><div v-if="!users.length" class="py-8 text-center text-slate-500">暂无用户</div></div>
  </div></div>
  <div v-if="preview" class="fixed inset-0 z-40 flex flex-col bg-slate-950">
    <div class="min-h-0 flex-1 overflow-auto bg-slate-900"><div v-if="previewLoading" class="grid h-full place-items-center p-8 text-center text-slate-400"><div><div class="text-lg text-slate-200">正在生成{{previewType==='xlsx'?'表格':' Word'}}预览…</div><div class="mt-2 text-sm">大文件可能需要等待 10–30 秒，请勿关闭窗口</div></div></div><div v-else-if="previewError" class="grid h-full place-items-center p-8 text-center text-slate-300">{{previewError}}</div>
      <img v-else-if="previewType==='image'" :src="rawURL(preview)" class="mx-auto max-h-full max-w-full object-contain"><video v-else-if="previewType==='video'" :src="rawURL(preview)" controls autoplay class="h-full w-full"></video>
      <iframe v-else-if="previewType==='pdf'" :src="rawURL(preview)" class="h-full w-full border-0 bg-white"></iframe><iframe v-else-if="previewType==='html'" :src="rawURL(preview)" sandbox="allow-scripts allow-forms allow-popups allow-same-origin" class="h-full w-full border-0 bg-white"></iframe><article v-else-if="previewType==='docx'" v-html="docxHTML" class="docx-view mx-auto my-5 max-w-5xl rounded-xl bg-white p-6 text-slate-900 shadow-xl sm:p-10"></article>
      <div v-else-if="previewType==='xlsx'" class="min-h-full bg-slate-100 text-slate-900"><div class="sticky top-0 z-10 flex gap-2 overflow-x-auto border-b border-slate-300 bg-white px-4 py-2 shadow-sm"><button v-for="name in sheetNames" :key="name" @click="selectSheet(name)" :class="currentSheet===name?'bg-cyan-600 text-white':'bg-slate-100 hover:bg-slate-200'" class="shrink-0 rounded-lg px-3 py-2 text-xs font-medium">{{name}}</button></div><div v-html="xlsxHTML" class="xlsx-view overflow-auto p-4"></div></div>
    </div></div>
  </div>
</div><script>
const {createApp,ref,computed,onMounted,onBeforeUnmount}=Vue;
createApp({setup(){const base=document.body.dataset.base||'',previewToken=document.body.dataset.previewToken||'',previewOrigin=location.protocol+'//'+location.hostname+':'+document.body.dataset.previewPort,username=document.body.dataset.username||'',isAdmin=document.body.dataset.isAdmin==='true',canUpload=document.body.dataset.canUpload==='true',items=ref([]),path=ref(''),loading=ref(false),dragging=ref(false),message=ref(''),preview=ref(null),previewType=ref(''),previewLoading=ref(false),previewError=ref(''),docxHTML=ref(''),xlsxHTML=ref(''),sheetNames=ref([]),currentSheet=ref(''),userModal=ref(false),users=ref([]),currentUserId=ref(0),newUser=ref({username:'',password:'',is_admin:false,can_upload:true});let xlsxBook=null;
const crumbs=computed(()=>path.value?path.value.split('/').filter(Boolean):[]),currentName=computed(()=>crumbs.value.at(-1)||'共享文件'),enc=encodeURIComponent,zipURL=computed(()=>base+'/api/zip?path='+enc(path.value));
async function load(p=''){loading.value=true;try{const r=await fetch(base+'/api/list?path='+enc(p));if(!r.ok)throw new Error((await r.json()).error||'加载失败');const d=await r.json();items.value=d.items||[];path.value=p;history.replaceState(null,'',base+'/?path='+enc(p))}catch(e){toast(e.message)}finally{loading.value=false}}
function goRoot(){load('')} function goCrumb(i){load(crumbs.value.slice(0,i+1).join('/'))} function icon(x){if(x.is_dir)return '📁';if(['.jpg','.jpeg','.png','.gif','.webp','.svg'].includes(x.ext))return '🖼️';if(['.mp4','.webm','.mov','.m4v'].includes(x.ext))return '🎬';if(x.ext==='.pdf')return '📕';if(['.docx','.doc'].includes(x.ext))return '📘';if(x.ext==='.xlsx')return '📊';if(['.html','.htm'].includes(x.ext))return '🌐';return '📄'}
function previewable(x){return ['.jpg','.jpeg','.png','.gif','.webp','.svg','.mp4','.webm','.mov','.m4v','.pdf','.html','.htm','.docx','.doc','.xlsx'].includes(x.ext)}
function formatSize(n){if(n<1024)return n+' B';let u=['KB','MB','GB','TB'],i=-1;do{n/=1024;i++}while(n>=1024&&i<u.length-1);return n.toFixed(n<10?1:0)+' '+u[i]} function formatDate(v){return new Date(v).toLocaleString('zh-CN',{dateStyle:'medium',timeStyle:'short'})}
function viewPath(p){return p.split('/').map(enc).join('/')} function rawURL(x){return ['.html','.htm'].includes(x.ext)?previewOrigin+base+'/view/'+previewToken+'/'+viewPath(x.path):base+'/api/raw?path='+enc(x.path)} function downloadURL(x){return base+'/api/download?path='+enc(x.path)}
function sanitizeHTML(html){const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,iframe,object,embed,link,meta,base').forEach(x=>x.remove());doc.querySelectorAll('*').forEach(el=>{for(const a of [...el.attributes])if(a.name.toLowerCase().startsWith('on')||['javascript:','data:text/html'].some(v=>a.value.trim().toLowerCase().startsWith(v)))el.removeAttribute(a.name)});return doc.body.innerHTML}
function selectSheet(name){if(!xlsxBook?.Sheets[name])return;currentSheet.value=name;xlsxHTML.value=sanitizeHTML(XLSX.utils.sheet_to_html(xlsxBook.Sheets[name],{id:'xlsx-table'}))}
async function openItem(x){if(x.is_dir){load(x.path);return}const e=x.ext;if(e==='.doc'){preview.value=x;previewError.value='旧版 .doc 格式无法在浏览器中解析，请下载后用本地 Office 打开。';previewType.value='';return}const types={'.jpg':'image','.jpeg':'image','.png':'image','.gif':'image','.webp':'image','.svg':'image','.mp4':'video','.webm':'video','.mov':'video','.m4v':'video','.pdf':'pdf','.html':'html','.htm':'html','.docx':'docx','.xlsx':'xlsx'};if(!types[e]){location.href=downloadURL(x);return}preview.value=x;previewType.value=types[e];previewError.value='';docxHTML.value='';xlsxHTML.value='';sheetNames.value=[];if(types[e]==='docx'){previewLoading.value=true;try{const r=await fetch(rawURL(x));if(!r.ok)throw new Error('读取 Word 文件失败');const result=await mammoth.convertToHtml({arrayBuffer:await r.arrayBuffer()});docxHTML.value=sanitizeHTML(result.value)||'<p>文档无可显示内容</p>'}catch(err){previewError.value=err.message}finally{previewLoading.value=false}}else if(types[e]==='xlsx'){previewLoading.value=true;try{const r=await fetch(rawURL(x));if(!r.ok)throw new Error('读取 Excel 文件失败');xlsxBook=XLSX.read(await r.arrayBuffer(),{type:'array',cellDates:true});sheetNames.value=xlsxBook.SheetNames||[];if(!sheetNames.value.length)throw new Error('工作簿中没有可显示的工作表');selectSheet(sheetNames.value[0])}catch(err){previewError.value='Excel 预览失败：'+err.message}finally{previewLoading.value=false}}}
function closePreview(){preview.value=null;previewError.value='';docxHTML.value='';xlsxHTML.value='';sheetNames.value=[];currentSheet.value='';xlsxBook=null} async function uploadFiles(files){if(!files?.length)return;const fd=new FormData();for(const f of files)fd.append('files',f);toast('正在上传 '+files.length+' 个文件…',0);try{const r=await fetch(base+'/api/upload?path='+enc(path.value),{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||'上传失败');toast('已上传 '+d.count+' 个文件');load(path.value)}catch(e){toast(e.message)}} let timer;function toast(v,delay=2200){message.value=v;clearTimeout(timer);if(delay)timer=setTimeout(()=>message.value='',delay)}
async function openUsers(){userModal.value=true;await loadUsers()}async function loadUsers(){try{const r=await fetch(base+'/api/admin/users');const d=await r.json();if(!r.ok)throw new Error(d.error);users.value=(d.users||[]).map(u=>({...u,password:''}));currentUserId.value=d.current_user_id}catch(e){toast(e.message)}}async function createUser(){try{const r=await fetch(base+'/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(newUser.value)});const d=await r.json();if(!r.ok)throw new Error(d.error);newUser.value={username:'',password:'',is_admin:false,can_upload:true};toast('用户已创建');await loadUsers()}catch(e){toast(e.message)}}async function saveUser(u){try{const r=await fetch(base+'/api/admin/users',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(u)});const d=await r.json();if(!r.ok)throw new Error(d.error);u.password='';toast('用户已更新');await loadUsers()}catch(e){toast(e.message)}}async function deleteUser(u){if(!confirm('确定删除用户“'+u.username+'”吗？'))return;try{const r=await fetch(base+'/api/admin/users?id='+u.id,{method:'DELETE'});const d=await r.json();if(!r.ok)throw new Error(d.error);toast('用户已删除');await loadUsers()}catch(e){toast(e.message)}}
function handleKeydown(event){if(event.key==='Escape'&&preview.value)closePreview()}
let dragDepth=0;function isFileDrag(event){return Array.from(event.dataTransfer?.types||[]).includes('Files')}function handleDragEnter(event){if(!canUpload||preview.value||userModal.value||!isFileDrag(event))return;event.preventDefault();dragDepth++;dragging.value=true}function handleDragOver(event){if(!canUpload||preview.value||!isFileDrag(event))return;event.preventDefault();event.dataTransfer.dropEffect='copy'}function handleDragLeave(event){if(!dragging.value)return;event.preventDefault();dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)dragging.value=false}function handleDrop(event){if(!canUpload||preview.value||!isFileDrag(event))return;event.preventDefault();dragDepth=0;dragging.value=false;uploadFiles(event.dataTransfer.files)}
onMounted(()=>{window.addEventListener('keydown',handleKeydown);window.addEventListener('dragenter',handleDragEnter);window.addEventListener('dragover',handleDragOver);window.addEventListener('dragleave',handleDragLeave);window.addEventListener('drop',handleDrop);load(new URLSearchParams(location.search).get('path')||'')});onBeforeUnmount(()=>{window.removeEventListener('keydown',handleKeydown);window.removeEventListener('dragenter',handleDragEnter);window.removeEventListener('dragover',handleDragOver);window.removeEventListener('dragleave',handleDragLeave);window.removeEventListener('drop',handleDrop)});return{base,username,isAdmin,canUpload,items,path,loading,dragging,message,preview,previewType,previewLoading,previewError,docxHTML,xlsxHTML,sheetNames,currentSheet,userModal,users,currentUserId,newUser,crumbs,currentName,zipURL,enc,load,goRoot,goCrumb,icon,previewable,formatSize,formatDate,rawURL,downloadURL,selectSheet,openItem,closePreview,uploadFiles,openUsers,createUser,saveUser,deleteUser}}}).mount('#app');
</script></body></html>
